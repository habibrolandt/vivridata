# VivriData CI — pile complète
#   caddy          : seul point d'entrée public (80/443), HTTPS automatique, répartition de charge
#   app            : API FastAPI, 2 répliques par défaut (docker compose up -d --scale app=4 pour monter)
#   db             : PostgreSQL, données sur volume persistant, aucun port publié
#   prometheus     : collecte des métriques (app + VM)
#   grafana        : tableaux de bord, servi sous /grafana
#   node-exporter  : métriques système de la VM (CPU, RAM, disque)
#   backup         : sauvegarde à la demande vers Azure Blob Storage (profil "tools")

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [frontend]

  app:
    build: .
    image: vivridata-app:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_KEY: ${API_KEY}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    deploy:
      replicas: 2              # 2 instances par défaut : la panne d'une instance ne coupe pas le service
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    mem_limit: 256m
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    mem_limit: 256m
    networks: [backend]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vivridata.json
      GF_USERS_DEFAULT_LANGUAGE: fr-FR
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    depends_on: [prometheus]
    networks: [frontend, backend]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    networks: [backend]

  backup:
    build: ./backup
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      AZ_STORAGE_ACCOUNT: ${AZ_STORAGE_ACCOUNT}
    depends_on: [db]
    networks: [backend]

volumes:
  pgdata:
  prom_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
