global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Toutes les répliques de l'API, découvertes automatiquement par le DNS Docker
  - job_name: app
    metrics_path: /metrics
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
